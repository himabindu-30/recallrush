# =====================================================
# application.properties = project settings
# =====================================================

server.port=8080

# Error JSON lo "message" kuda pampadaniki (frontend lo error chupinchadaniki kavali)
server.error.include-message=always

# ---------- DATABASE: H2 (FILE mode) ----------
# File mode = data ./data/ folder lo save avthundi, restart chesina data poadu.
spring.datasource.url=jdbc:h2:file:./data/recalldb
spring.datasource.username=sa
spring.datasource.password=
# Browser lo tables chudadaniki: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/recalldb)
spring.h2.console.enabled=true

# ---------- DATABASE: PostgreSQL (use cheyyali ante paina H2 lines teesesi ivi enable cheyyandi) ----------
# (pom.xml lo kuda postgresql dependency uncomment cheyyali)
# spring.datasource.url=jdbc:postgresql://localhost:5432/recallrush
# spring.datasource.username=postgres
# spring.datasource.password=your_password

# ---------- JPA / Hibernate ----------
# update = tables lekapothe create chestundi, unte data alaage vunchutundi
spring.jpa.hibernate.ddl-auto=update
# Console lo SQL chupinchu (learning ki super useful)
spring.jpa.show-sql=true

# ---------- JWT ----------
# Secret key: token ni sign cheyyadaniki. Minimum 32 characters undali.
# REAL deployment lo idi code lo petakudadu, environment variable lo pettali!
app.jwt.secret=recallrush-super-secret-key-change-me-please-1234567890
# Token validity: 24 hours (milliseconds lo)
app.jwt.expiration-ms=86400000
