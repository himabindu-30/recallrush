# =====================================================
# application.properties - application settings
# =====================================================

server.port=8080

# Include the error message in error responses (the frontend displays it)
server.error.include-message=always

# ---------- DATABASE: H2 (file mode) ----------
# File mode persists data in the ./data/ folder, so it survives restarts.
spring.datasource.url=jdbc:h2:file:./data/recalldb
spring.datasource.username=sa
spring.datasource.password=
# Browser database console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/recalldb)
spring.h2.console.enabled=true

# ---------- DATABASE: PostgreSQL (to use it, comment out the H2 lines above and enable these) ----------
# (also uncomment the postgresql dependency in pom.xml)
# spring.datasource.url=jdbc:postgresql://localhost:5432/recallrush
# spring.datasource.username=postgres
# spring.datasource.password=your_password

# ---------- JPA / Hibernate ----------
# update = create missing tables, keep existing data
spring.jpa.hibernate.ddl-auto=update
# Print generated SQL to the console (useful while learning)
spring.jpa.show-sql=true

# ---------- JWT ----------
# Signing key for tokens; must be at least 32 characters.
# Reads the JWT_SECRET environment variable and falls back to a development-only value.
# In a real deployment always set JWT_SECRET and never commit a real secret.
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-1234567890}
# Token validity: 24 hours (in milliseconds)
app.jwt.expiration-ms=86400000
