<!DOCTYPE html>
<!--
  FRONTEND = user chuse screen (Single Page App).
  Ee file static/ folder lo undi kabatti Spring Boot automatic ga serve chestundi:
  browser lo http://localhost:8080 open chesthe idi vastundi.

  3 files:  index.html (skeleton)  +  style.css (looks)  +  app.js (logic, backend tho matladadam)
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecallRush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= TOP BAR ================= -->
  <header class="topbar">
    <div class="brand">⚡ RecallRush</div>

    <!-- User login ayyaka matrame chupistam (hidden class tho) -->
    <div id="userBar" class="userbar hidden">
      <span class="chip" id="chipLevel">Lv 1</span>
      <span class="chip" id="chipXp">0 XP</span>
      <span class="chip" id="chipStreak">🔥 0</span>
      <button class="ghost" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="container">

    <!-- ================= AUTH VIEW (login / register) ================= -->
    <section id="authView" class="card auth">
      <h2 id="authTitle">Welcome back 👋</h2>
      <p class="muted">Study smarter with spaced repetition.</p>
      <input id="authUser" placeholder="Username" autocomplete="username">
      <input id="authPass" type="password" placeholder="Password (min 6)" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') submitAuth()">
      <p class="error" id="authError"></p>
      <button id="authBtn" onclick="submitAuth()">Login</button>
      <p class="muted center">
        <span id="authSwitchText">New here?</span>
        <a href="#" onclick="toggleAuthMode(); return false;" id="authSwitchLink">Create account</a>
      </p>
    </section>

    <!-- ================= APP VIEW (login ayyaka) ================= -->
    <div id="appView" class="hidden">

      <!-- Tabs -->
      <nav class="tabs">
        <button class="tab" data-tab="decks" onclick="switchTab('decks')">📚 Decks</button>
        <button class="tab" data-tab="study" onclick="switchTab('study')">🎯 Study</button>
        <button class="tab" data-tab="stats" onclick="switchTab('stats')">📊 Stats</button>
        <button class="tab" data-tab="board" onclick="switchTab('board')">🏆 Leaderboard</button>
      </nav>

      <!-- ---------- DECKS TAB ---------- -->
      <section id="tab-decks" class="tabview">

        <!-- Decks list view -->
        <div id="deckListView">
          <div class="card">
            <h3>Create a deck</h3>
            <div class="row">
              <input id="deckName" placeholder="Deck name (ex: DBMS Unit 2)">
              <input id="deckDesc" placeholder="Description (optional)">
              <button onclick="createDeck()">Add</button>
            </div>
            <p class="error" id="deckError"></p>
          </div>
          <div id="deckList"></div>
        </div>

        <!-- Cards (inside a deck) view -->
        <div id="cardView" class="hidden">
          <button class="ghost" onclick="closeDeck()">← Back to decks</button>
          <h3 id="cardViewTitle"></h3>
          <div class="card">
            <input id="cardFront" placeholder="Front (question)">
            <textarea id="cardBack" rows="2" placeholder="Back (answer)"></textarea>
            <p class="error" id="cardError"></p>
            <button onclick="addCard()">Add card</button>
          </div>
          <div id="cardList"></div>
        </div>
      </section>

      <!-- ---------- STUDY TAB ---------- -->
      <section id="tab-study" class="tabview hidden">
        <div class="card">
          <div class="row">
            <select id="studyDeck"></select>
            <button onclick="startStudy()">Start session</button>
          </div>
        </div>

        <!-- Flashcard area -->
        <div id="studyArea" class="hidden">
          <div class="progress"><div id="studyBar"></div></div>
          <p class="muted center" id="studyCount"></p>

          <div class="flashcard">
            <div class="label">QUESTION</div>
            <div id="cardFrontText" class="big"></div>

            <div id="answerBox" class="hidden">
              <hr>
              <div class="label">ANSWER</div>
              <div id="cardBackText" class="answer"></div>
            </div>
          </div>

          <div class="center">
            <button id="showBtn" onclick="showAnswer()">Show answer</button>
          </div>

          <!-- Rating buttons (answer chupinchaka) -->
          <div id="rateBox" class="rate hidden">
            <button class="r1" onclick="rate(1)">Again<small>forgot</small></button>
            <button class="r3" onclick="rate(3)">Hard<small>barely</small></button>
            <button class="r4" onclick="rate(4)">Good<small>recalled</small></button>
            <button class="r5" onclick="rate(5)">Easy<small>instant</small></button>
          </div>
          <p class="center feedback" id="feedback"></p>
        </div>

        <!-- Session complete message -->
        <div id="studyDone" class="card center hidden">
          <h2>🎉 Session complete!</h2>
          <p id="studySummary" class="muted"></p>
        </div>
      </section>

      <!-- ---------- STATS TAB ---------- -->
      <section id="tab-stats" class="tabview hidden">
        <div class="tiles" id="statTiles"></div>

        <div class="card">
          <h3 id="levelTitle"></h3>
          <div class="progress"><div id="xpBar"></div></div>
          <p class="muted" id="xpText"></p>
        </div>

        <div class="card">
          <h3>Last 90 days</h3>
          <div id="heatmap" class="heatmap"></div>
          <p class="muted legend">Less
            <span class="cell l0"></span><span class="cell l1"></span><span class="cell l2"></span>
            <span class="cell l3"></span><span class="cell l4"></span> More</p>
        </div>
      </section>

      <!-- ---------- LEADERBOARD TAB ---------- -->
      <section id="tab-board" class="tabview hidden">
        <div class="card"><div id="board"></div></div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
